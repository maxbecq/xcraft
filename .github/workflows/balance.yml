name: Balance

# On every PR touching balance.json: 98 AI games per pair of factions with main's numbers and with the PR's, compared in a comment.
on:
  pull_request:
    paths: [src/balance.json]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: balance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11.6.2 ci
      - run: npm test
      - name: Games with this PR's numbers
        run: BIG_OUT=after.json npm run balance:big
      - name: Games with main's numbers
        run: |
          cp src/balance.json balance.pr.json
          git show origin/${{ github.base_ref || 'main' }}:src/balance.json > src/balance.json
          BIG_OUT=before.json npm run balance:big
          cp balance.pr.json src/balance.json
      - run: node scripts/balance-report.mjs before.json after.json > report.md
      - run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'pull_request'
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file report.md --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ github.token }}
